name: On New Release

on:
  repository_dispatch:
    types: [lsp-add-or-update-package]

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: make-pr
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: echo "$PAYLOAD" | python3 auto-update-repository.py
      # PRs made with GITHUB_TOKEN don't run CI without a maintainer approving it, so use the sublimelsp app instead.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.SUBLIMELSP_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: '${{ steps.make-pr.outputs.commit_message }}'
          committer: GitHub <noreply@github.com>
          author: GitHub <noreply@github.com>
          delete-branch: true
          branch-suffix: random
          title: '${{ steps.make-pr.outputs.pr_title }}'
          body: '${{ steps.make-pr.outputs.pr_body }}'
